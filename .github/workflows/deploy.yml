name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发部署，取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          # Assignment1 保持原样，与仓库中的静态文件一致
          mkdir -p _site/Assignment1
          cp -r Assignment1/. _site/Assignment1/

          # Assignment2 作为静态目录原样发布，放进去的文件即线上内容
          # .gitkeep 只是占位符，不发布
          if [ -n "$(ls -A Assignment2 2>/dev/null | grep -v '^\.gitkeep$')" ]; then
            mkdir -p _site/Assignment2
            rsync -a --exclude '.gitkeep' Assignment2/ _site/Assignment2/
          else
            # 目录暂时为空，给一个占位页，避免链接指向 404
            mkdir -p _site/Assignment2
            cat > _site/Assignment2/index.html <<'HTML'
            <!DOCTYPE html>
            <html lang="zh-CN">
              <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1" />
                <title>Assignment2 · 罗语墨</title>
                <style>
                  body {
                    margin: 0;
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #fdfaf6;
                    color: #2f2a26;
                    font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
                    text-align: center;
                    line-height: 1.8;
                  }
                  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
                  p { margin: 0 0 22px; font-size: 14px; color: #6f6560; }
                  a { color: #a8445e; text-decoration: none; font-size: 14px; }
                  a:hover { text-decoration: underline; }
                </style>
              </head>
              <body>
                <div>
                  <h1>Assignment2</h1>
                  <p>新作品准备中</p>
                  <a href="/">← 返回首页</a>
                </div>
              </body>
            </html>
            HTML
          fi

          # 根路径给一个索引页，指向各个子站
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>罗语墨 · 作品与写作</title>
              <style>
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: #fdfaf6;
                  color: #2f2a26;
                  font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
                  line-height: 1.75;
                }
                .box { text-align: center; padding: 32px; }
                h1 {
                  margin: 0 0 6px;
                  font-size: 26px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                }
                p { margin: 0 0 26px; color: #6f6560; font-size: 14px; }
                a.item {
                  display: block;
                  max-width: 340px;
                  margin: 0 auto 12px;
                  padding: 16px 20px;
                  border: 1px solid #ece3dd;
                  border-radius: 12px;
                  text-decoration: none;
                  color: inherit;
                  transition: border-color 0.15s ease;
                }
                a.item:hover { border-color: #d4708a; }
                a.item b { display: block; font-size: 16px; font-weight: 600; }
                a.item span { font-size: 13px; color: #6f6560; }
              </style>
            </head>
            <body>
              <div class="box">
                <h1>罗语墨</h1>
                <p>作品与写作</p>
                <a class="item" href="/Assignment1/">
                  <b>《你当像鸟飞往你的山》</b>
                  <span>交互式名著解说作品</span>
                </a>
                <a class="item" href="/Assignment2/">
                  <b>Assignment2</b>
                  <span>新作品 · 建设中</span>
                </a>
                <a class="item" href="/her-march/">
                  <b>《她的行军》</b>
                  <span>交互式三维叙事作品</span>
                </a>
              </div>
            </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
