name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发部署，取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -e

          # Assignment1 保持原样，与仓库中的静态文件一致
          mkdir -p _site/Assignment1
          cp -r Assignment1/. _site/Assignment1/

          # Assignment2 作为静态目录原样发布，放进去的文件即线上内容
          # .gitkeep 只是占位符，不发布
          if [ -n "$(ls -A Assignment2 2>/dev/null | grep -v '^\.gitkeep$')" ]; then
            mkdir -p _site/Assignment2
            rsync -a --exclude '.gitkeep' Assignment2/ _site/Assignment2/
          else
            # 目录暂时为空，给一个占位页，避免索引页链接指向 404
            mkdir -p _site/Assignment2
            cp .github/placeholder/assignment2.html _site/Assignment2/index.html
          fi

          # 根路径索引页
          cp .github/placeholder/index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
